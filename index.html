<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Kiranastore | Calgary's Premium Indian Grocery Store</title>
    <meta name="description" content="Shop Calgary's best selection of authentic Indian flours, premium basmati rices, hand-ground spices, traditional pickles, and frozen delicacies at My Kiranastore. In-store shopping open 7 days a week in Calgary, AB." />
    <meta name="keywords" content="Indian grocery Calgary, My Kiranastore Calgary, Indian spices Calgary, basmati rice Calgary, Indian food store Calgary, South Asian grocery Calgary, Calgary Indian store" />
    <meta name="robots" content="index, follow" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="My Kiranastore | Calgary's Premium Indian Grocery Store" />
    <meta property="og:description" content="Shop Calgary's best selection of authentic Indian flours, premium basmati rices, hand-ground spices, traditional pickles, and frozen delicacies." />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#15803d" />
    
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- PWA Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registered successfully:', reg.scope))
            .catch(err => console.log('Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
