    <!-- PWA Service Worker Registration with Auto Cache Busting -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => {
              console.log('[PWA] Service Worker registered:', reg.scope);
              // Force update check on every page load
              reg.update();

              // Auto refresh when a new Service Worker takes over
              let refreshing = false;
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                  refreshing = true;
                  window.location.reload();
                }
              });
            })
            .catch(err => console.log('[PWA] Service Worker registration failed:', err));
        });

        // Global chunk loading error handler: Clear stale caches and auto-reload page if bundle fails
        window.addEventListener('error', (e) => {
          if (e.message && (
            e.message.includes('Loading chunk') || 
            e.message.includes('dynamically imported module') || 
            e.message.includes('Importing a module script failed') ||
            e.message.includes('Unexpected token')
          )) {
            console.warn('[CacheBuster] Stale asset load detected. Purging cache and reloading...');
            if ('caches' in window) {
              caches.keys().then(names => {
                return Promise.all(names.map(name => caches.delete(name)));
              }).then(() => {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          }
        }, true);
      }
    </script>
